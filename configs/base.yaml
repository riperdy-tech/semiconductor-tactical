project:
  name: high-beta-tactical
  timezone_report: America/New_York
  random_seed: 42

strategy:
  variant: risk_controlled
  universe:
    - MU
    - SNDK
    - SKHY
    - AMD
  two_x_etfs: []
  bar_interval: 1m

signals:
  pullback_zscore: -1.5
  trend_window: 60
  sector_filter: true
  relative_volume_filter: true
  event_filter: true

exits:
  family: atr
  target_atr: 1.0
  stop_atr: 1.0
  max_hold_minutes: 120

portfolio:
  max_symbol_weight: 0.25
  max_gross_leverage: 1.0
  max_layers: 2
  risk_per_trade_pct: 0.25

costs:
  equity_commission_bps: 0.0
  equity_slippage_bps: 5.0
  option_slippage_bps: 10.0
  market_impact_bps_per_1pct_volume: 10.0
  margin_rate_annual: 0.0

options:
  enabled: false
  max_dte: 14
  min_dte: 1
  moneyness: otm
  repurchase_rule: pullback

research:
  start: null
  end: null
  train_end: null
  validation_end: null
  test_start: null

outputs:
  root: reports
